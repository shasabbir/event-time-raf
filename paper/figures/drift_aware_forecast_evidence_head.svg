<text x="725.0" y="133.0" class="label" text-anchor="middle" dominant-baseline="middle">24 horizon heads</text>
<text x="725.0" y="158" class="mono" text-anchor="middle" dominant-baseline="middle">Yhat_L: B x 24</text>
