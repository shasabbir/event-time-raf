<text x="431.0" y="282" class="mono" text-anchor="middle" dominant-baseline="middle">9 features</text>
<text x="631.0" y="238.0" class="label" text-anchor="middle" dominant-baseline="middle">Event counts, active</text>
<text x="631.0" y="260.0" class="label" text-anchor="middle" dominant-baseline="middle">states, burst ratio</text>
<text x="631.0" y="282" class="mono" text-anchor="middle" dominant-baseline="middle">39 features</text>
<text x="531" y="390" class="label" text-anchor="middle" dominant-baseline="middle">||</text>
