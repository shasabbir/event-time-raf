<text x="154.0" y="154" class="mono" text-anchor="middle" dominant-baseline="middle">coverage=0.9997</text>
<text x="154.0" y="223.0" class="label" text-anchor="middle" dominant-baseline="middle">NOAA GHCNh</text>
<text x="154.0" y="245.0" class="label" text-anchor="middle" dominant-baseline="middle">station 72297023129</text>
<text x="154.0" y="266" class="mono" text-anchor="middle" dominant-baseline="middle">coverage=0.9923</text>
<text x="154.0" y="335.0" class="label" text-anchor="middle" dominant-baseline="middle">NOAA events</text>
<text x="154.0" y="357.0" class="label" text-anchor="middle" dominant-baseline="middle">hash + manifest</text>
