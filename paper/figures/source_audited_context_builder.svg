<text x="338" y="53" class="group" text-anchor="start" dominant-baseline="middle">Hourly context construction</text>
<text x="431.0" y="108.0" class="label" text-anchor="middle" dominant-baseline="middle">PM2.5 lags, rolling</text>
<text x="431.0" y="130.0" class="label" text-anchor="middle" dominant-baseline="middle">and differences</text>
<text x="431.0" y="152" class="mono" text-anchor="middle" dominant-baseline="middle">23 features</text>
<text x="631.0" y="108.0" class="label" text-anchor="middle" dominant-baseline="middle">Weather values,</text>
<text x="631.0" y="130.0" class="label" text-anchor="middle" dominant-baseline="middle">flags, rolling means</text>
